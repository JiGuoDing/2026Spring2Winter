<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">问题背景：多轮 Agent 的请求并不独立，复用需要统一管理</title>
  <desc id="desc">多轮会话与相似请求可以复用会话语义、RAG 知识和历史回答，但复用前需要检查语义、版本权限、新鲜度与质量；Flink 控制面需要同时决定缓存、算力和调度路由，以降低推理成本并保证质量、时延和租户公平。</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Microsoft YaHei', 'Source Han Sans SC', 'Noto Sans CJK SC', sans-serif; }
      .kicker { font-size: 18px; font-weight: 700; fill: #0F766E; letter-spacing: 1.5px; }
      .title { font-size: 36px; font-weight: 800; fill: #1F2D2A; letter-spacing: 0.3px; }
      .subtitle { font-size: 18px; fill: #5F6B72; }
      .tag { font-size: 14.5px; fill: #52615D; }
      .panel-title { font-size: 23px; font-weight: 800; fill: #1F2D2A; }
      .panel-sub { font-size: 14px; fill: #6B7772; }
      .section-title { font-size: 16px; font-weight: 750; fill: #31413C; }
      .section-note { font-size: 13px; fill: #7A8681; }
      .bubble-label { font-size: 13px; font-weight: 650; fill: #6A7772; }
      .bubble-text { font-size: 18px; font-weight: 650; fill: #22302C; }
      .card-title { font-size: 18px; font-weight: 750; fill: #22302C; }
      .card-sub { font-size: 13px; fill: #6C7873; }
      .mini-label { font-size: 12.5px; font-weight: 700; }
      .mini-text { font-size: 13px; fill: #4F5C57; }
      .chip { font-size: 13px; font-weight: 650; fill: #31413C; }
      .decision-title { font-size: 18px; font-weight: 750; fill: #22302C; }
      .decision { font-size: 13.5px; fill: #46534E; }
      .worker-name { font-size: 14px; font-weight: 800; }
      .worker-meta { font-size: 13px; font-weight: 650; }
      .goal-label { font-size: 13px; font-weight: 750; letter-spacing: 0.5px; fill: #D9ECE5; }
      .goal-text { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .goal-side { font-size: 14px; fill: #C7DED6; }
      .tiny { font-size: 12.5px; fill: #7C8883; }
      .green { fill: #0F766E; }
      .blue { fill: #356B8C; }
      .amber { fill: #B86424; }
      .red { fill: #B4473F; }
      .muted { fill: #63706B; }
      .rule { stroke: #D9E2DC; stroke-width: 1.4; }
      .hair { stroke: #E5EBE7; stroke-width: 1; }
      .panel { fill: #FAFCFA; stroke: #DCE5DF; stroke-width: 1.4; }
      .card { fill: #FFFFFF; stroke: #DFE7E1; stroke-width: 1.3; }
      .flow { fill: none; stroke: #0F766E; stroke-width: 2.7; stroke-linecap: round; }
      .feedback { fill: none; stroke: #B86424; stroke-width: 2.2; stroke-dasharray: 6 5; stroke-linecap: round; }
    ]]></style>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10.5,6 L1,11 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10.5,6 L1,11 Z" fill="#B86424"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18352C" flood-opacity="0.055"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#FBFCFA"/>
  <rect x="0" y="0" width="1600" height="5" fill="#0F766E"/>

  <g id="header">
    <text x="50" y="45" class="kicker">问题背景</text>
    <text x="50" y="89" class="title">多轮 Agent 的请求并不独立，复用需要统一管理</text>
    <text x="50" y="122" class="subtitle">会话、知识与回答可以减少重复工作；但能否复用、复用后是否划算，还取决于权限、时效与当前负载。</text>
    <rect x="1250" y="38" width="300" height="34" rx="17" fill="#EDF5F1" stroke="#CFE5DB"/>
    <text x="1400" y="60" text-anchor="middle" class="tag">多租户 · 动态负载 · 流式请求</text>
    <line x1="50" y1="145" x2="1550" y2="145" class="rule"/>
  </g>

  <!-- Request stream -->
  <g id="request-stream">
    <rect x="50" y="172" width="335" height="535" rx="16" class="panel" filter="url(#shadow)"/>
    <rect x="50" y="172" width="5" height="535" rx="2.5" fill="#356B8C"/>
    <text x="76" y="209" class="panel-title">请求流</text>
    <text x="76" y="235" class="panel-sub">同一会话追问，跨会话也可能问相似问题</text>

    <rect x="76" y="268" width="283" height="82" rx="13" class="card" filter="url(#shadow)"/>
    <text x="96" y="293" class="bubble-label">租户 A · 第 1 轮</text>
    <text x="96" y="322" class="bubble-text">查一下华东区销量</text>

    <rect x="76" y="366" width="283" height="82" rx="13" class="card" filter="url(#shadow)"/>
    <text x="96" y="391" class="bubble-label">租户 A · 第 2 轮</text>
    <rect x="286" y="378" width="55" height="22" rx="11" fill="#EEF5F8"/>
    <text x="313.5" y="393" text-anchor="middle" font-size="11.5" font-weight="650" fill="#356B8C">延续</text>
    <text x="96" y="420" class="bubble-text">再看一下同比</text>

    <rect x="76" y="464" width="283" height="82" rx="13" fill="#FFFFFF" stroke="#A9D1C6" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="96" y="489" class="bubble-label">租户 B · 新会话</text>
    <rect x="274" y="476" width="67" height="22" rx="11" fill="#EAF6F1"/>
    <text x="307.5" y="491" text-anchor="middle" font-size="11.5" font-weight="650" fill="#0F766E">相似问题</text>
    <text x="96" y="518" class="bubble-text">华东区销量是多少？</text>

    <line x1="76" y1="579" x2="359" y2="579" class="hair"/>
    <text x="76" y="607" class="section-title">多轮 · 跨会话 · 多租户</text>
    <text x="76" y="634" class="panel-sub">这些请求可能复用同一份已有状态。</text>
    <text x="76" y="660" class="tiny">但每一次复用是否合适，还要由控制面判断。</text>
  </g>

  <path d="M386 410 H407" class="flow" marker-end="url(#arrow-green)"/>

  <!-- Flink control plane -->
  <g id="control-plane">
    <rect x="410" y="172" width="830" height="535" rx="16" fill="#FFFFFF" stroke="#D7E3DC" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="410" y="172" width="830" height="5" rx="2.5" fill="#0F766E"/>
    <text x="438" y="209" class="panel-title">Flink 控制面</text>
    <text x="438" y="235" class="panel-sub">统一管理可复用状态，并决定每条请求怎样处理</text>
    <rect x="1084" y="190" width="128" height="28" rx="14" fill="#EEF6F2" stroke="#CFE4DA"/>
    <text x="1148" y="208" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0F766E">事件驱动 · 有状态</text>

    <text x="440" y="267" class="section-title">可以复用的三类状态</text>
    <text x="1208" y="267" text-anchor="end" class="section-note">每类状态都有收益，也都有风险</text>

    <!-- ctx -->
    <rect x="440" y="282" width="240" height="124" rx="13" class="card" filter="url(#shadow)"/>
    <rect x="456" y="298" width="36" height="36" rx="10" fill="#EAF2F6"/>
    <text x="474" y="322" text-anchor="middle" font-size="13.5" font-weight="800" fill="#356B8C">ctx</text>
    <text x="504" y="313" class="card-title">会话上下文</text>
    <text x="504" y="333" class="card-sub">摘要 · 事实 · 约束</text>
    <line x1="456" y1="349" x2="664" y2="349" class="hair"/>
    <text x="456" y="370" class="mini-label green">收益</text>
    <text x="490" y="370" class="mini-text">少做上下文恢复</text>
    <text x="456" y="391" class="mini-label red">风险</text>
    <text x="490" y="391" class="mini-text">语义冲突或过期</text>

    <!-- rag -->
    <rect x="700" y="282" width="240" height="124" rx="13" class="card" filter="url(#shadow)"/>
    <rect x="716" y="298" width="36" height="36" rx="10" fill="#EAF5F0"/>
    <text x="734" y="322" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0F766E">rag</text>
    <text x="764" y="313" class="card-title">RAG 知识</text>
    <text x="764" y="333" class="card-sub">文档块 · 数据表</text>
    <line x1="716" y1="349" x2="924" y2="349" class="hair"/>
    <text x="716" y="370" class="mini-label green">收益</text>
    <text x="750" y="370" class="mini-text">少做重复检索</text>
    <text x="716" y="391" class="mini-label red">风险</text>
    <text x="750" y="391" class="mini-text">权限或时效变化</text>

    <!-- resp -->
    <rect x="960" y="282" width="240" height="124" rx="13" class="card" filter="url(#shadow)"/>
    <rect x="976" y="298" width="36" height="36" rx="10" fill="#FFF2E6"/>
    <text x="994" y="322" text-anchor="middle" font-size="13.5" font-weight="800" fill="#B86424">resp</text>
    <text x="1024" y="313" class="card-title">历史回答</text>
    <text x="1024" y="333" class="card-sub">相似问题 · 旧回答</text>
    <line x1="976" y1="349" x2="1184" y2="349" class="hair"/>
    <text x="976" y="370" class="mini-label green">收益</text>
    <text x="1010" y="370" class="mini-text">少做一次完整推理</text>
    <text x="976" y="391" class="mini-label red">风险</text>
    <text x="1010" y="391" class="mini-text">问题并不完全相同</text>

    <!-- reuse checks -->
    <rect x="440" y="432" width="770" height="88" rx="13" fill="#F5FAF7" stroke="#D6E7DE" stroke-width="1.3"/>
    <text x="460" y="460" class="card-title">复用之前</text>
    <text x="460" y="486" class="card-sub">缓存命中不等于可以直接使用</text>

    <rect x="650" y="454" width="128" height="42" rx="10" fill="#FFFFFF" stroke="#DCE6E0"/>
    <circle cx="667" cy="475" r="8" fill="#E5F3ED"/>
    <text x="667" y="479" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">✓</text>
    <text x="683" y="480" class="chip">语义匹配</text>

    <rect x="788" y="454" width="128" height="42" rx="10" fill="#FFFFFF" stroke="#DCE6E0"/>
    <circle cx="805" cy="475" r="8" fill="#E5F3ED"/>
    <text x="805" y="479" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">✓</text>
    <text x="821" y="480" class="chip">版本与权限</text>

    <rect x="926" y="454" width="128" height="42" rx="10" fill="#FFFFFF" stroke="#DCE6E0"/>
    <circle cx="943" cy="475" r="8" fill="#E5F3ED"/>
    <text x="943" y="479" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">✓</text>
    <text x="959" y="480" class="chip">内容未过期</text>

    <rect x="1064" y="454" width="128" height="42" rx="10" fill="#FFFFFF" stroke="#DCE6E0"/>
    <circle cx="1081" cy="475" r="8" fill="#E5F3ED"/>
    <text x="1081" y="479" text-anchor="middle" font-size="11" font-weight="800" fill="#0F766E">✓</text>
    <text x="1097" y="480" class="chip">质量可接受</text>

    <text x="440" y="551" class="section-title">在动态负载下，控制面需要同时决定</text>
    <text x="1208" y="551" text-anchor="end" class="section-note">三个决定互相影响，需要一起考虑</text>

    <!-- cache -->
    <rect x="440" y="570" width="240" height="108" rx="13" class="card"/>
    <rect x="456" y="586" width="24" height="24" rx="8" fill="#FFF1E4"/>
    <text x="468" y="603" text-anchor="middle" font-size="12" font-weight="800" fill="#B86424">1</text>
    <text x="490" y="604" class="decision-title">缓存管理</text>
    <text x="456" y="628" class="decision">· 保留哪些中间结果</text>
    <text x="456" y="649" class="decision">· 缓存规模设多大</text>
    <text x="456" y="670" class="decision">· 何时刷新或淘汰</text>

    <!-- compute -->
    <rect x="700" y="570" width="240" height="108" rx="13" class="card"/>
    <rect x="716" y="586" width="24" height="24" rx="8" fill="#EDF4F8"/>
    <text x="728" y="603" text-anchor="middle" font-size="12" font-weight="800" fill="#356B8C">2</text>
    <text x="750" y="604" class="decision-title">算力配置</text>
    <text x="716" y="628" class="decision">· 配置多少推理实例</text>
    <text x="716" y="649" class="decision">· 批次大小与并发</text>
    <text x="716" y="670" class="decision">· 如何随负载调整</text>

    <!-- scheduling -->
    <rect x="960" y="570" width="240" height="108" rx="13" class="card"/>
    <rect x="976" y="586" width="24" height="24" rx="8" fill="#EAF6F1"/>
    <text x="988" y="603" text-anchor="middle" font-size="12" font-weight="800" fill="#0F766E">3</text>
    <text x="1010" y="604" class="decision-title">调度与路由</text>
    <text x="976" y="628" class="decision">· 先处理哪条请求</text>
    <text x="976" y="649" class="decision">· 复用哪类状态</text>
    <text x="976" y="670" class="decision">· 发往哪个 Worker</text>

    <text x="440" y="694" font-size="13.5" font-weight="650" fill="#B86424">复用并非零成本：验证、存储、失效和迁移都会占用资源。</text>
  </g>

  <path d="M1202 621 H1259" class="flow" marker-end="url(#arrow-green)"/>

  <!-- Execution side -->
  <g id="execution">
    <rect x="1265" y="172" width="285" height="535" rx="16" class="panel" filter="url(#shadow)"/>
    <rect x="1265" y="172" width="5" height="535" rx="2.5" fill="#0F766E"/>
    <text x="1291" y="209" class="panel-title">Agent 执行</text>
    <text x="1291" y="235" class="panel-sub">推理、工具调用与回复</text>

    <text x="1291" y="270" class="section-title">Worker 池</text>
    <text x="1524" y="270" text-anchor="end" class="section-note">实例会扩缩容</text>

    <rect x="1288" y="286" width="239" height="60" rx="11" class="card"/>
    <text x="1304" y="310" class="worker-name amber">W1</text>
    <text x="1342" y="310" class="worker-meta amber">缓存多 · 负载高</text>
    <rect x="1304" y="322" width="205" height="7" rx="3.5" fill="#EEF2EF"/>
    <rect x="1304" y="322" width="150" height="7" rx="3.5" fill="#D39256"/>

    <rect x="1288" y="358" width="239" height="60" rx="11" class="card"/>
    <text x="1304" y="382" class="worker-name green">W2</text>
    <text x="1342" y="382" class="worker-meta green">缓存少 · 负载低</text>
    <rect x="1304" y="394" width="205" height="7" rx="3.5" fill="#EEF2EF"/>
    <rect x="1304" y="394" width="66" height="7" rx="3.5" fill="#59A18F"/>

    <rect x="1288" y="430" width="239" height="60" rx="11" class="card"/>
    <text x="1304" y="454" class="worker-name blue">W3</text>
    <text x="1342" y="454" class="worker-meta blue">有部分缓存 · 负载适中</text>
    <rect x="1304" y="466" width="205" height="7" rx="3.5" fill="#EEF2EF"/>
    <rect x="1304" y="466" width="110" height="7" rx="3.5" fill="#6E94AD"/>

    <rect x="1288" y="514" width="239" height="108" rx="12" fill="#F4F8F6" stroke="#DCE6E0"/>
    <text x="1306" y="541" font-size="14.5" font-weight="750" fill="#31413C">路由需要权衡</text>
    <text x="1306" y="565" class="mini-text">缓存亲和要求请求集中，</text>
    <text x="1306" y="586" class="mini-text">负载均衡则要求请求分散。</text>
    <text x="1306" y="607" class="mini-text">这两个目标经常冲突。</text>

    <text x="1291" y="654" class="panel-sub">执行结果会改变缓存和负载，</text>
    <text x="1291" y="677" class="panel-sub">控制面需要随请求流持续调整。</text>
  </g>

  <!-- Goal -->
  <g id="goal">
    <rect x="50" y="735" width="1500" height="72" rx="15" fill="#173F37" filter="url(#shadow)"/>
    <rect x="74" y="753" width="92" height="30" rx="15" fill="#28594F"/>
    <text x="120" y="773" text-anchor="middle" class="goal-label">研究目标</text>
    <text x="186" y="777" class="goal-text">降低推理资源成本，同时保证回答质量、时延和租户公平</text>
    <text x="1525" y="777" text-anchor="end" class="goal-side">缓存 · 算力 · 调度与路由</text>
  </g>

  <text x="50" y="870" class="tiny">问题背景｜多租户流式 Agent 的资源管理</text>
  <text x="1550" y="870" text-anchor="end" class="tiny">示意，非实测数据</text>
</svg>