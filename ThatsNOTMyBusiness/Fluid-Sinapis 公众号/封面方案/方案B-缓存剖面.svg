<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="654" viewBox="0 0 1536 654" role="img" aria-label="Fluid-Sinapis 封面方案B：缓存热力剖面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset=".52" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0a2235"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#20d8e6" stop-opacity=".19"/>
      <stop offset=".58" stop-color="#087f9d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#087f9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12617e" stop-opacity=".7"/>
      <stop offset="1" stop-color="#08283e" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd07a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff8a5b" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f3d0" stop-opacity=".78"/>
      <stop offset="1" stop-color="#19a9cb" stop-opacity=".38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8dc9e8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="microDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8adfe8" fill-opacity=".12"/>
    </pattern>
    <pattern id="isoGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#92e7e7" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Noto Sans SC','Segoe UI',sans-serif; }
      .mono { font-family: 'Cascadia Mono','Consolas','Noto Sans SC',monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1536" height="654" fill="url(#bg)"/>
  <rect width="1536" height="654" fill="url(#grid)"/>
  <rect width="1536" height="654" fill="url(#microDots)" opacity=".5"/>
  <ellipse cx="1090" cy="335" rx="470" ry="315" fill="url(#halo)"/>
  <path d="M0 574 C360 546 740 598 1536 546" fill="none" stroke="#69c7df" stroke-opacity=".055" stroke-width="1"/>
  <path d="M0 597 C430 566 880 626 1536 572" fill="none" stroke="#69c7df" stroke-opacity=".035" stroke-width="1"/>

  <g opacity=".62" class="mono" fill="#7fb7cc" font-size="11">
    <text x="96" y="66">CACHE / THERMAL / PRIORITY</text>
    <text x="96" y="84">HOT DATA, ELASTIC CAPACITY</text>
    <path d="M96 94H300" stroke="#476d83" stroke-opacity=".55"/>
  </g>
  <g transform="translate(1340 49)">
    <rect width="98" height="36" rx="18" fill="#0f2c40" stroke="#3acfd4" stroke-opacity=".5"/>
    <circle cx="17" cy="18" r="3" fill="#72f0c8"/>
    <text x="32" y="23" class="mono" font-size="13" fill="#d9fbff">V0.1</text>
  </g>

  <g transform="translate(96 128)">
    <rect x="0" y="-12" width="10" height="10" fill="#56e5dd"/>
    <text x="22" y="0" class="mono" font-size="15" fill="#b8d5e3">AGENTIC CACHE MANAGEMENT</text>
    <text x="0" y="105" font-family="'Segoe UI','Noto Sans SC',sans-serif" font-size="82" font-weight="600" letter-spacing="-2.8" fill="#f4fbff">Fluid-Sinapis</text>
    <rect x="1" y="128" width="216" height="3" rx="1.5" fill="url(#titleRule)"/>
    <text x="2" y="196" font-size="30" font-weight="400" letter-spacing=".2" fill="#d2e5ee">基于 LLM Agent 的</text>
    <text x="2" y="234" font-size="30" font-weight="500" letter-spacing=".5" fill="#f0f8fb">智能云原生缓存管理系统</text>
    <path d="M2 289H534" stroke="#6591a5" stroke-opacity=".32"/>
    <g font-size="17" fill="#c8edf2" font-weight="500">
      <text x="2" y="330">感知热度</text>
      <circle cx="94" cy="324" r="2.4" fill="#59e6da"/>
      <text x="116" y="330">智能调度</text>
      <circle cx="208" cy="324" r="2.4" fill="#59e6da"/>
      <text x="230" y="330">弹性缓存</text>
    </g>
    <text x="2" y="360" class="mono" font-size="10" fill="#638da1">HOTNESS&#160;&#160;&#160;/&#160;&#160;&#160;PLACEMENT&#160;&#160;&#160;/&#160;&#160;&#160;SCALE</text>
  </g>

  <g>
    <ellipse cx="1090" cy="330" rx="370" ry="203" fill="none" stroke="#52b8d1" stroke-opacity=".18" stroke-dasharray="2 9"/>
    <path d="M727 330 C755 206 887 143 1058 128 C1230 113 1372 192 1440 319" fill="none" stroke="#43dfdc" stroke-opacity=".65" stroke-width="2"/>
    <path d="M727 330 C744 459 883 518 1065 527 C1241 536 1396 458 1440 319" fill="none" stroke="#348ca5" stroke-opacity=".36" stroke-width="2" stroke-dasharray="8 9"/>
    <g fill="#73f3d0">
      <circle cx="727" cy="330" r="6" filter="url(#glow)"/>
      <circle cx="1058" cy="128" r="6" filter="url(#glow)"/>
      <circle cx="1440" cy="319" r="6" filter="url(#glow)"/>
    </g>
    <g class="mono" font-size="10" fill="#70a6b7">
      <text x="696" y="364">01 / SENSE</text>
      <text x="1058" y="98" text-anchor="middle">02 / DECIDE</text>
      <text x="1440" y="287" text-anchor="end">03 / EXECUTE</text>
    </g>
  </g>

  <g transform="translate(1090 330)">
    <g transform="translate(0 92)">
      <g transform="scale(1 .42)">
        <g transform="rotate(45)">
          <rect x="-250" y="-250" width="500" height="500" rx="18" fill="#061b2c" stroke="#1b758e" stroke-opacity=".38"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#plane)" stroke="#2a91a9" stroke-opacity=".48"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#isoGrid)"/>
        </g>
      </g>
    </g>
    <g transform="translate(0 50)">
      <g transform="scale(1 .42)">
        <g transform="rotate(45)">
          <rect x="-250" y="-250" width="500" height="500" rx="18" fill="#061b2c" stroke="#269ab2" stroke-opacity=".48"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#plane)" stroke="#35b6c7" stroke-opacity=".60"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#isoGrid)"/>
          <rect x="-120" y="-118" width="55" height="55" rx="6" fill="url(#cold)" opacity=".45"/>
          <rect x="4" y="-68" width="55" height="55" rx="6" fill="url(#cold)" opacity=".6"/>
          <rect x="102" y="55" width="55" height="55" rx="6" fill="url(#cold)" opacity=".35"/>
        </g>
      </g>
    </g>
    <g transform="translate(0 8)">
      <g transform="scale(1 .42)">
        <g transform="rotate(45)">
          <rect x="-250" y="-250" width="500" height="500" rx="18" fill="#061b2c" stroke="#59e5e0" stroke-opacity=".55"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#plane)" stroke="#69ede4" stroke-opacity=".78"/>
          <rect x="-241" y="-241" width="482" height="482" rx="13" fill="url(#isoGrid)"/>
          <g filter="url(#glow)">
            <rect x="-178" y="-160" width="55" height="55" rx="6" fill="url(#cold)" opacity=".58"/>
            <rect x="-98" y="-113" width="55" height="55" rx="6" fill="url(#cold)" opacity=".82"/>
            <rect x="-18" y="-160" width="55" height="55" rx="6" fill="url(#cold)" opacity=".54"/>
            <rect x="80" y="-112" width="55" height="55" rx="6" fill="url(#cold)" opacity=".75"/>
            <rect x="-140" y="-22" width="55" height="55" rx="6" fill="url(#cold)" opacity=".58"/>
            <rect x="-5" y="-22" width="55" height="55" rx="6" fill="url(#hot)" stroke="#ffd792" filter="url(#amberGlow)"/>
            <rect x="123" y="-22" width="55" height="55" rx="6" fill="url(#cold)" opacity=".44"/>
            <rect x="-70" y="83" width="55" height="55" rx="6" fill="url(#cold)" opacity=".37"/>
            <rect x="96" y="92" width="55" height="55" rx="6" fill="url(#cold)" opacity=".48"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g filter="url(#glow)">
    <path d="M1090 276V208" stroke="#f9d28a" stroke-opacity=".92" stroke-width="1.5" stroke-dasharray="5 6"/>
    <circle cx="1090" cy="196" r="22" fill="#081f31" stroke="#ffd68b" stroke-width="1.5"/>
    <path d="M1080 196H1100M1090 186V206" stroke="#ffd68b" stroke-width="1.3"/>
  </g>
  <g transform="translate(1124 174)">
    <rect width="166" height="38" rx="7" fill="#0b2739" stroke="#d9ab62" stroke-opacity=".45"/>
    <text x="14" y="16" class="mono" font-size="9" fill="#e9c78d">HOT DATA / PRIORITY</text>
    <text x="14" y="29" font-size="11" fill="#ffe5b8">优先预热 + 弹性扩容</text>
  </g>
  <g transform="translate(754 449)">
    <rect width="155" height="48" rx="8" fill="#082538" stroke="#51b6c3" stroke-opacity=".38"/>
    <text x="12" y="18" class="mono" font-size="9" fill="#6ea6b8">CACHE PROFILE</text>
    <text x="12" y="35" font-size="13" fill="#cfeaf0">冷热分层</text>
  </g>
  <g transform="translate(1262 447)">
    <rect width="163" height="48" rx="8" fill="#082538" stroke="#51b6c3" stroke-opacity=".38"/>
    <text x="12" y="18" class="mono" font-size="9" fill="#6ea6b8">CONTROL SIGNAL</text>
    <text x="12" y="35" font-size="13" fill="#cfeaf0">扩缩 / 预热 / 回收</text>
  </g>

  <g class="mono" fill="#527e92" font-size="10">
    <text x="96" y="620">FLUID-CLOUDNATIVE / SINAPIS</text>
    <text x="1440" y="620" text-anchor="end">HEAT-AWARE CACHE ORCHESTRATION</text>
  </g>
  <path d="M96 606H540" stroke="#477184" stroke-opacity=".35"/>
  <path d="M1010 606H1440" stroke="#477184" stroke-opacity=".35"/>
</svg>

