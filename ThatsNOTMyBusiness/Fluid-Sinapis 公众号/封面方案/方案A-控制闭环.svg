<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="654" viewBox="0 0 1536 654" role="img" aria-label="Fluid-Sinapis 封面方案A：Agent 控制闭环">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset=".52" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0a2235"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16d9e7" stop-opacity=".19"/>
      <stop offset=".58" stop-color="#087f9d" stop-opacity=".09"/>
      <stop offset="1" stop-color="#087f9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30e4e8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1679b6" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="slabSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0aa4c2" stop-opacity=".32"/>
      <stop offset="1" stop-color="#0b5574" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8dc9e8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="microDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8adfe8" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      text { font-family: 'Noto Sans SC','Segoe UI',sans-serif; }
      .mono { font-family: 'Cascadia Mono','Consolas','Noto Sans SC',monospace; letter-spacing: 2px; }
      .muted { fill: #8ba9bd; }
      .cyan { fill: #4de6e4; }
      .mint { fill: #75f1c7; }
    </style>
  </defs>

  <rect width="1536" height="654" fill="url(#bg)"/>
