<svg width="1160" height="392" viewBox="0 0 1100 372" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1100" height="44" fill="#F2F5F9" /><text x="20" y="28" font-size="15" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">生产控制区（安全Ⅰ区 / 安全Ⅱ区）</text><text x="1080" y="28" font-size="13" fill="#B3261E" text-anchor="end" font-family="Microsoft YaHei">数据单向进入，控制指令不回写</text><line x1="550" y1="44" x2="550" y2="56" stroke="#1F3864" stroke-width="1.5" /><polygon points="550,58 544,48 556,48" fill="#1F3864" /><rect x="0" y="58" width="1100" height="314" fill="#FFFFFF" stroke="#1F3864" stroke-width="2" /><text x="20" y="84" font-size="16" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">管理信息区（安全Ⅲ区）</text><text x="1080" y="84" font-size="13" fill="#7A8699" text-anchor="end" font-family="Microsoft YaHei">L3 独立集群也只落在这里</text><rect x="12" y="96" width="1076" height="40" fill="#F2F5F9" /><text x="26" y="122" font-size="15" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">L4 应用与门户</text><rect x="160" y="102" width="210" height="28" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="176" y="121" font-size="13" fill="#3D4C63" font-family="Microsoft YaHei">统一门户</text><rect x="380" y="102" width="210" height="28" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="396" y="121" font-size="13" fill="#3D4C63" font-family="Microsoft YaHei">统一待办</text><rect x="600" y="102" width="210" height="28" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="616" y="121" font-size="13" fill="#3D4C63" font-family="Microsoft YaHei">租户自建应用</text><rect x="820" y="102" width="210" height="28" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="836" y="121" font-size="13" fill="#3D4C63" font-family="Microsoft YaHei">外部厂商应用</text><rect x="12" y="144" width="1076" height="56" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="26" y="168" font-size="15" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">L3 平台服务</text><text x="26" y="188" font-size="11" fill="#7A8699" font-family="Microsoft YaHei">七板块 | 数据面</text><rect x="160" y="150" width="118" height="44" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="219" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">应用构建</text><text x="219" y="185" font-size="11" fill="#B3261E" text-anchor="middle" font-family="Microsoft YaHei">必改</text><rect x="284" y="150" width="118" height="44" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="343" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">应用集成</text><text x="343" y="185" font-size="11" fill="#B3261E" text-anchor="middle" font-family="Microsoft YaHei">必改</text><rect x="408" y="150" width="118" height="44" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="467" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">数据集成</text><text x="467" y="185" font-size="11" fill="#B3261E" text-anchor="middle" font-family="Microsoft YaHei">必改</text><rect x="532" y="150" width="118" height="44" fill="#EEF3F9" stroke="#C9D8E8" stroke-width="1" /><text x="591" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">时序数据</text><text x="591" y="185" font-size="11" fill="#2E6DA4" text-anchor="middle" font-family="Microsoft YaHei">轻改</text><rect x="656" y="150" width="118" height="44" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="715" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">大数据</text><text x="715" y="185" font-size="11" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">不动</text><rect x="780" y="150" width="118" height="44" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="839" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">大模型</text><text x="839" y="185" font-size="11" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">不动</text><rect x="904" y="150" width="118" height="44" fill="#EEF3F9" stroke="#C9D8E8" stroke-width="1" /><text x="963" y="168" font-size="13" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">中间件</text><text x="963" y="185" font-size="11" fill="#2E6DA4" text-anchor="middle" font-family="Microsoft YaHei">轻改</text><rect x="12" y="208" width="1076" height="50" fill="#EEF3F9" stroke="#2E6DA4" stroke-width="1.5" /><text x="26" y="232" font-size="15" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">L2 管控面</text><text x="26" y="250" font-size="11" fill="#2E6DA4" font-family="Microsoft YaHei">控制面 | 六块事实源</text><rect x="160" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="230" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">租户管理</text><rect x="306" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="376" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">身份联邦</text><rect x="452" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="522" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">配额与准入</text><rect x="598" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="668" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">开通编排</text><rect x="744" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="814" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">计量采集</text><rect x="890" y="214" width="140" height="38" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1" /><text x="960" y="238" font-size="13" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">审计与合规</text><rect x="12" y="266" width="1076" height="40" fill="#F2F5F9" /><text x="26" y="292" font-size="15" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">L1 基础设施</text><text x="160" y="292" font-size="12" fill="#3D4C63" font-family="Microsoft YaHei">信创服务器（鲲鹏 / 飞腾 / 海光）· 虚拟化或裸金属 · 容器运行时 · 块与文件存储 · VPC · 防火墙</text><text x="26" y="336" font-size="14" fill="#3D4C63" font-family="Microsoft YaHei">控制面出错会影响全平台，数据面出错只影响一个租户——所以改造重心放在 L2。</text><text x="26" y="356" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">必改 5 项、轻改 3 项、不动 2 项；业务应用侧基本零改动。</text></svg>