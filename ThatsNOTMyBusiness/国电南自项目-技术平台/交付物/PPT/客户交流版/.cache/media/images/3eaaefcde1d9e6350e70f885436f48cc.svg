<svg width="1160" height="337" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="350" height="250" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="0" y="0" width="350" height="44" fill="#7A8699" /><text x="20" y="29" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">① 网关 · 软限流</text><text x="20" y="84" font-size="22" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">限流与计量</text><line x1="20" y1="98" x2="330" y2="98" stroke="#D9DEE7" stroke-width="1" /><text x="20" y="126" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="96" y="126" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">所有入口流量</text><text x="20" y="154" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="96" y="154" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">调用次数、Token、并发</text><text x="20" y="182" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="96" y="182" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">429 + 降级提示</text><rect x="20" y="200" width="310" height="32" fill="#F2F5F9" /><text x="30" y="221" font-size="14" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">软 —— 可协商，也可临时放宽</text><rect x="375" y="0" width="350" height="250" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="375" y="0" width="350" height="44" fill="#2E6DA4" /><text x="395" y="29" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">② 准入校验 · 准硬</text><text x="395" y="84" font-size="22" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">创建前拦截</text><line x1="395" y1="98" x2="705" y2="98" stroke="#D9DEE7" stroke-width="1" /><text x="395" y="126" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="471" y="126" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">创建 / 变更资源时</text><text x="395" y="154" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="471" y="154" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">命名、配额余量、镜像白名单</text><text x="395" y="182" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="471" y="182" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">拒绝创建并返回原因</text><rect x="395" y="200" width="310" height="32" fill="#F2F5F9" /><text x="405" y="221" font-size="14" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">准硬 —— 得配合审计防绕过</text><rect x="750" y="0" width="350" height="250" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="750" y="0" width="350" height="44" fill="#1F3864" /><text x="770" y="29" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">③ K8s 配额 · 硬</text><text x="770" y="84" font-size="22" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">运行时封顶</text><line x1="770" y1="98" x2="1080" y2="98" stroke="#D9DEE7" stroke-width="1" /><text x="770" y="126" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="846" y="126" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">资源实际分配</text><text x="770" y="154" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="846" y="154" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">CPU、内存、存储、Pod 数</text><text x="770" y="182" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="846" y="182" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">Pending、驱逐、OOM</text><rect x="770" y="200" width="310" height="32" fill="#F2F5F9" /><text x="780" y="221" font-size="14" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">硬 —— 内核层执行，绕不过去</text><rect x="0" y="272" width="6" height="48" fill="#1F3864" /><rect x="6" y="272" width="1094" height="48" fill="#F2F5F9" /><text x="26" y="302" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">K8s 只看得见资源，看不见调用次数、Token 与并发用户——这三类量必须在网关计量，所以网关是 P0 的第一个里程碑。</text></svg>