<svg width="1160" height="337" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1100" height="92" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="0" y="0" width="8" height="92" fill="#B3261E" /><text x="26" y="38" font-size="13" fill="#7A8699">必改</text><text x="26" y="76" font-size="26" font-weight="bold" fill="#B3261E" font-family="Microsoft YaHei">5 项</text><rect x="160" y="26" width="140" height="40" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="230" y="52" font-size="14" fill="#3D4C63" text-anchor="middle">多租户管理</text><rect x="310" y="26" width="140" height="40" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="380" y="52" font-size="14" fill="#3D4C63" text-anchor="middle">统一身份接入</text><rect x="460" y="26" width="140" height="40" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="530" y="52" font-size="14" fill="#3D4C63" text-anchor="middle">API 网关</text><rect x="610" y="26" width="140" height="40" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="680" y="52" font-size="14" fill="#3D4C63" text-anchor="middle">低代码平台</text><rect x="760" y="26" width="140" height="40" fill="#FBEDEB" stroke="#D9B5B1" stroke-width="1" /><text x="830" y="52" font-size="14" fill="#3D4C63" text-anchor="middle">集成平台</text><text x="925" y="44" font-size="13" fill="#7A8699">不触碰租户边界</text><text x="925" y="64" font-size="13" font-weight="bold" fill="#B3261E">就无法开通租户</text><rect x="0" y="110" width="1100" height="92" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="0" y="110" width="8" height="92" fill="#2E6DA4" /><text x="26" y="148" font-size="13" fill="#7A8699">轻改</text><text x="26" y="186" font-size="26" font-weight="bold" fill="#2E6DA4">3 项</text><rect x="160" y="136" width="140" height="40" fill="#EEF3F9" stroke="#C9D8E8" stroke-width="1" /><text x="230" y="162" font-size="14" fill="#3D4C63" text-anchor="middle">统一门户</text><rect x="310" y="136" width="140" height="40" fill="#EEF3F9" strok