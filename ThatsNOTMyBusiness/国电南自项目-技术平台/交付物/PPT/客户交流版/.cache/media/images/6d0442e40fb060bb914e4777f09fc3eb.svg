<svg width="1160" height="392" viewBox="0 0 1160 392" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="450" height="360" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="24" y="36" font-size="18" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">C-1　某水电厂 · 检修管理应用</text><text x="24" y="60" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">不供主数据、不接生产控制区实时数据</text><rect x="24" y="84" width="92" height="76" fill="#F2F5F9" /><text x="36" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">B 业务</text><text x="36" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">2</text><rect x="126" y="84" width="92" height="76" fill="#F2F5F9" /><text x="138" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">D 数据</text><text x="138" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">2</text><rect x="228" y="84" width="92" height="76" fill="#F2F5F9" /><text x="240" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">R 监管</text><text x="240" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">3</text><rect x="330" y="84" width="92" height="76" fill="#F2F5F9" /><text x="342" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">S SLA</text><text x="342" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">2</text><text x="24" y="206" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">总分 T</text><text x="24" y="272" font-size="64" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">9</text><rect x="110" y="234" width="96" height="40" fill="#1F3864" /><text x="128" y="261" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">落 L1</text><text x="24" y="316" font-size="14" fill="#3D4C63" font-family="Microsoft YaHei">默认路径，本方案的原型验证场景（S2）</text><rect x="710" y="0" width="450" height="360" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" /><text x="734" y="36" font-size="18" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">C-2　同一应用 · 向集团供设备台账</text><text x="734" y="60" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">一旦成为“重要数据”提供方，D 从 2 抬到 4</text><rect x="734" y="84" width="92" height="76" fill="#F2F5F9" /><text x="746" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">B 业务</text><text x="746" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">2</text><rect x="836" y="84" width="92" height="76" fill="#F6E7E5" /><text x="848" y="108" font-size="13" fill="#B3261E" font-family="Microsoft YaHei">D 数据</text><text x="848" y="142" font-size="26" font-weight="bold" fill="#B3261E" font-family="Microsoft YaHei">4</text><rect x="938" y="84" width="92" height="76" fill="#F2F5F9" /><text x="950" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">R 监管</text><text x="950" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">3</text><rect x="1040" y="84" width="96" height="76" fill="#F2F5F9" /><text x="1052" y="108" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">S SLA</text><text x="1052" y="142" font-size="26" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">2</text><text x="734" y="206" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">总分 T</text><text x="734" y="272" font-size="64" font-weight="bold" fill="#B3261E" font-family="Microsoft YaHei">11</text><rect x="836" y="234" width="96" height="40" fill="#B3261E" /><text x="854" y="261" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">落 L2</text><text x="734" y="316" font-size="14" fill="#3D4C63" font-family="Microsoft YaHei">需要独立数据库实例与独立入口，成本升到 2.5–3.0×</text><line x1="470" y1="150" x2="690" y2="150" stroke="#B3261E" stroke-width="2" /><polygon points="690,150 678,143 678,157" fill="#B3261E" /><text x="580" y="136" font-size="16" font-weight="bold" fill="#B3261E" text-anchor="middle" font-family="Microsoft YaHei">D 2 → 4</text><text x="580" y="176" font-size="14" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">只是多供一份台账</text><text x="0" y="384" font-size="14" fill="#3D4C63" font-family="Microsoft YaHei">升级触发点是“是否跨租户提供 / 接收数据”，不是数据量大小。另：C-5 外部开发商即使 9 分，也因主体条款强制 L3。</text></svg>