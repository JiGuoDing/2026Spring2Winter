<svg width="1160" height="363.01" viewBox="0 0 1100 344.4" xmlns="http://www.w3.org/2000/svg"><text x="0" y="16.29" font-size="13" font-weight="bold" fill="#7A8699" font-family="Microsoft YaHei">登录时</text><rect x="0" y="30.25" width="180" height="74.46" fill="#FFFFFF" stroke="#7A8699" stroke-width="1" /><text x="90" y="60.5" font-size="17" font-weight="bold" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">用户 / 浏览器</text><text x="90" y="86.1" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">不持有平台账号</text><rect x="260" y="30.25" width="240" height="74.46" fill="#1F3864" /><text x="380" y="60.5" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei">集团 4A</text><text x="380" y="86.1" font-size="13" fill="#C9D4E4" text-anchor="middle" font-family="Microsoft YaHei">唯一身份权威，不建第二套</text><rect x="580" y="30.25" width="220" height="74.46" fill="#2E6DA4" /><text x="690" y="60.5" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei">平台网关 · SP</text><text x="690" y="86.1" font-size="13" fill="#C9D4E4" text-anchor="middle" font-family="Microsoft YaHei">只验签，不发号</text><rect x="880" y="30.25" width="220" height="74.46" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" /><text x="990" y="60.5" font-size="17" font-weight="bold" fill="#1F3864" text-anchor="middle" font-family="Microsoft YaHei">租户上下文</text><text x="990" y="86.1" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">短时令牌 + 租户标识</text><line x1="180" y1="67.48" x2="248" y2="67.48" stroke="#7A8699" stroke-width="1.5" /><polygon points="260,58 246,51 246,65" fill="#7A8699" /><line x1="500" y1="67.48" x2="568" y2="67.48" stroke="#7A8699" stroke-width="1.5" /><polygon points="580,58 566,51 566,65" fill="#7A8699" /><line x1="800" y1="67.48" x2="868" y2="67.48" stroke="#7A8699" stroke-width="1.5" /><polygon points="880,58 866,51 866,65" fill="#7A8699" /><text x="0" y="127.98" font-size="13" fill="#7A8699" font-family="Microsoft YaHei">① 浏览器重定向到 4A　② OIDC / SAML2 断言（与存量 CAS 双栈并存）　③ 断言换平台短时令牌，票据内只放租户标识与角色码</text><text x="0" y="162.89" font-size="13" font-weight="bold" fill="#7A8699" font-family="Microsoft YaHei">同步时</text><rect x="0" y="176.85" width="1100" height="72.14" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><line x1="260" y1="176.85" x2="260" y2="248.99" stroke="#D9DEE7" stroke-width="1" /><line x1="560" y1="176.85" x2="560" y2="248.99" stroke="#D9DEE7" stroke-width="1" /><line x1="800" y1="176.85" x2="800" y2="248.99" stroke="#D9DEE7" stroke-width="1" /><text x="130" y="209.43" font-size="16" font-weight="bold" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">4A 组织 / 人员</text><text x="130" y="232.7" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">源头，只读</text><text x="410" y="209.43" font-size="16" font-weight="bold" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">可见范围过滤</text><text x="410" y="232.7" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">按租户授权裁剪子树</text><text x="680" y="209.43" font-size="16" font-weight="bold" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">增量对齐</text><text x="680" y="232.7" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">变更事件驱动，不全量重灌</text><text x="950" y="209.43" font-size="16" font-weight="bold" fill="#3D4C63" text-anchor="middle" font-family="Microsoft YaHei">冲突仲裁</text><text x="950" y="232.7" font-size="13" fill="#7A8699" text-anchor="middle" font-family="Microsoft YaHei">与 4A 冲突时一律以 4A 为准</text><rect x="0" y="279.24" width="6" height="55.85" fill="#B3261E" /><rect x="6" y="279.24" width="1094" height="55.85" fill="#F2F5F9" /><text x="26" y="314.14" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">外部账号（供应商、第三方运维）不并入集团域：独立身份域 + 独立准入策略 + 独立审计，用完即收。</text></svg>