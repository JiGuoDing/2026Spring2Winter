<svg width="1160" height="295" viewBox="0 0 1100 280" xmlns="http://www.w3.org/2000/svg"><line x1="90" y1="44" x2="1010" y2="44" stroke="#D9DEE7" stroke-width="2" /><circle cx="90" cy="44" r="22" fill="#1F3864" /><text x="90" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="90" y="98" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">基线快照</text><text x="90" y="124" font-size="13" fill="#7A8699" text-anchor="middle">接管前固化</text><text x="90" y="146" font-size="13" fill="#7A8699" text-anchor="middle">存量租户与配额</text><circle cx="274" cy="44" r="22" fill="#1F3864" /><text x="274" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="274" y="98" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">S2 全流程</text><text x="274" y="124" font-size="13" fill="#7A8699" text-anchor="middle">申请、开通、配权</text><text x="274" y="146" font-size="13" fill="#7A8699" text-anchor="middle">到下线走一遍</text><circle cx="458" cy="44" r="22" fill="#B3261E" /><text x="458" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="458" y="98" font-size="15" font-weight="bold" fill="#B3261E" text-anchor="middle">20 组越权</text><text x="458" y="124" font-size="13" fill="#7A8699" text-anchor="middle">A 租户访问 B 的</text><text x="458" y="146" font-size="13" fill="#7A8699" text-anchor="middle">每一类资源</text><circle cx="642" cy="44" r="22" fill="#1F3864" /><text x="642" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="642" y="98" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">三层配额</text><text x="642" y="124" font-size="13" fill="#7A8699" text-anchor="middle">逐层打满</text><text x="642" y="146" font-size="13" fill="#7A8699" text-anchor="middle">看哪层先拦住</text><circle cx="826" cy="44" r="22" fill="#1F3864" /><text x="826" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="826" y="98" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle">故障注入</text><text x="826" y="124" font-size="13" fill="#7A8699" text-anchor="middle">杀节点、断网</text><text x="826" y="146" font-size="13" fill="#7A8699" text-anchor="middle">打满存储</text><circle cx="1010" cy="44" r="22" fill="#2E6DA4" /><text x="1010" y="51" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="1010" y="98" font-size="15" font-weight="bold" fill="#2E6DA4" text-anchor="middle">审计回溯</text><text x="1010" y="124" font-size="13" fill="#7A8699" text-anchor="middle">一次越权尝试</text><text x="1010" y="146" font-size="13" fill="#7A8699" text-anchor="middle">追到人与时间</text><rect x="0" y="190" width="1100" height="72" fill="#F2F5F9" /><line x1="550" y1="190" x2="550" y2="262" stroke="#D9DEE7" stroke-width="1" /><text x="24" y="218" font-size="13" fill="#7A8699">门槛一 · 效率</text><text x="24" y="246" font-size="17" font-weight="bold" fill="#1F3864">L1 租户开通 ≤ 10 min（含配额与网络策略）</text><text x="574" y="218" font-size="13" fill="#7A8699">门槛二 · 安全</text><text x="574" y="246" font-size="17" font-weight="bold" fill="#B3261E">20 组越权用例 100% 拒绝，零漏放</text></svg>