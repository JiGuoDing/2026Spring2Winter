<svg width="540" height="455" viewBox="0 0 540 455" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="398.12" x2="520" y2="398.12" stroke="#1F3864" stroke-width="1.25" /><line x1="60" y1="398.12" x2="60" y2="34.12" stroke="#1F3864" stroke-width="1.25" /><line x1="60" y1="216.12" x2="520" y2="216.12" stroke="#D9DEE7" stroke-width="1" stroke-dasharray="4 4" /><line x1="290" y1="34.12" x2="290" y2="398.12" stroke="#D9DEE7" stroke-width="1" stroke-dasharray="4 4" /><text x="70" y="25.02" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">信任等级 高</text><text x="70" y="423.15" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">信任等级 低</text><text x="420" y="423.15" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">租户数量 多</text><circle cx="150" cy="125.12" r="7" fill="#1F3864" /><text x="164" y="120.57" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">集团总部租户</text><text x="164" y="143.32" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">1 个</text><circle cx="300" cy="170.62" r="7" fill="#1F3864" /><text x="314" y="166.07" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">区域/省公司</text><text x="314" y="188.82" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">31 个，管三类业态</text><circle cx="450" cy="109.2" r="7" fill="#1F3864" /><text x="330" y="86.45" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">厂站租户 近 700 个</text><circle cx="150" cy="341.25" r="9" fill="#B3261E" /><text x="164" y="336.7" font-size="16" fill="#B3261E" font-family="Microsoft YaHei">第三方开发商</text><text x="164" y="359.45" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">数量少，但不可信</text><rect x="306" y="263.9" width="214" height="65.97" fill="#F2F5F9" /><text x="320" y="291.2" font-size="15" fill="#1F3864" font-family="Microsoft YaHei">分类依据是信任等级，</text><text x="320" y="316.22" font-size="15" fill="#1F3864" font-family="Microsoft YaHei">不是租户数量</text></svg>