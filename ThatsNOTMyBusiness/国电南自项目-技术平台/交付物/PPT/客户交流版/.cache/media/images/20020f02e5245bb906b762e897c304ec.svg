<svg width="540" height="400" viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="350" x2="520" y2="350" stroke="#1F3864" stroke-width="1.25" /><line x1="60" y1="350" x2="60" y2="30" stroke="#1F3864" stroke-width="1.25" /><line x1="60" y1="190" x2="520" y2="190" stroke="#D9DEE7" stroke-width="1" stroke-dasharray="4 4" /><line x1="290" y1="30" x2="290" y2="350" stroke="#D9DEE7" stroke-width="1" stroke-dasharray="4 4" /><text x="70" y="22" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">信任等级 高</text><text x="70" y="372" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">信任等级 低</text><text x="420" y="372" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">租户数量 多</text><circle cx="150" cy="110" r="7" fill="#1F3864" /><text x="164" y="106" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">集团总部租户</text><text x="164" y="126" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">1 个</text><circle cx="300" cy="150" r="7" fill="#1F3864" /><text x="314" y="146" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">区域/省公司</text><text x="314" y="166" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">31 个，管三类业态</text><circle cx="450" cy="96" r="7" fill="#1F3864" /><text x="330" y="76" font-size="16" fill="#1F3864" font-family="Microsoft YaHei">厂站租户 近 700 个</text><circle cx="150" cy="300" r="9" fill="#B3261E" /><text x="164" y="296" font-size="16" fill="#B3261E" font-family="Microsoft YaHei">第三方开发商</text><text x="164" y="316" font-size="14" fill="#7A8699" font-family="Microsoft YaHei">数量少，但不可信</text><rect x="306" y="232" width="214" height="58" fill="#F2F5F9" /><text x="320" y="256" font-size="15" fill="#1F3864" font-family="Microsoft YaHei">分类依据是信任等级，</text><text x="320" y="278" font-size="15" fill="#1F3864" font-family="Microsoft YaHei">不是租户数量</text></svg>