<svg width="1160" height="355" viewBox="0 0 1100 337.09" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="350" height="263.35" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="0" y="0" width="350" height="46.35" fill="#7A8699" /><text x="20" y="30.55" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">① 网关 · 软限流</text><text x="20" y="88.49" font-size="22" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">限流与计量</text><line x1="20" y1="103.23" x2="330" y2="103.23" stroke="#D9DEE7" stroke-width="1" /><text x="20" y="132.73" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="96" y="132.73" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">所有入口流量</text><text x="20" y="162.22" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="96" y="162.22" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">调用次数、Token、并发</text><text x="20" y="191.72" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="96" y="191.72" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">429 + 降级提示</text><rect x="20" y="210.68" width="310" height="33.71" fill="#F2F5F9" /><text x="30" y="232.8" font-size="14" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">软 —— 可协商，也可临时放宽</text><rect x="375" y="0" width="350" height="263.35" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="375" y="0" width="350" height="46.35" fill="#2E6DA4" /><text x="395" y="30.55" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">② 准入校验 · 准硬</text><text x="395" y="88.49" font-size="22" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">创建前拦截</text><line x1="395" y1="103.23" x2="705" y2="103.23" stroke="#D9DEE7" stroke-width="1" /><text x="395" y="132.73" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="471" y="132.73" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">创建 / 变更资源时</text><text x="395" y="162.22" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="471" y="162.22" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">命名、配额余量、镜像白名单</text><text x="395" y="191.72" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="471" y="191.72" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">拒绝创建并返回原因</text><rect x="395" y="210.68" width="310" height="33.71" fill="#F2F5F9" /><text x="405" y="232.8" font-size="14" font-weight="bold" fill="#3D4C63" font-family="Microsoft YaHei">准硬 —— 得配合审计防绕过</text><rect x="750" y="0" width="350" height="263.35" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><rect x="750" y="0" width="350" height="46.35" fill="#1F3864" /><text x="770" y="30.55" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">③ K8s 配额 · 硬</text><text x="770" y="88.49" font-size="22" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">运行时封顶</text><line x1="770" y1="103.23" x2="1080" y2="103.23" stroke="#D9DEE7" stroke-width="1" /><text x="770" y="132.73" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">位置</text><text x="846" y="132.73" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">资源实际分配</text><text x="770" y="162.22" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">管什么</text><text x="846" y="162.22" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">CPU、内存、存储、Pod 数</text><text x="770" y="191.72" font-size="15" fill="#7A8699" font-family="Microsoft YaHei">超限后</text><text x="846" y="191.72" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">Pending、驱逐、OOM</text><rect x="770" y="210.68" width="310" height="33.71" fill="#F2F5F9" /><text x="780" y="232.8" font-size="14" font-weight="bold" fill="#1F3864" font-family="Microsoft YaHei">硬 —— 内核层执行，绕不过去</text><rect x="0" y="286.52" width="6" height="50.56" fill="#1F3864" /><rect x="6" y="286.52" width="1094" height="50.56" fill="#F2F5F9" /><text x="26" y="318.13" font-size="15" fill="#3D4C63" font-family="Microsoft YaHei">K8s 只看得见资源，看不见调用次数、Token 与并发用户——这三类量必须在网关计量，所以网关是 P0 的第一个里程碑。</text></svg>