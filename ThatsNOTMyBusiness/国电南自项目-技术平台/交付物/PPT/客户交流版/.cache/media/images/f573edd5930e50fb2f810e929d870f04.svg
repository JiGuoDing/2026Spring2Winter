<svg width="1160" height="428" viewBox="0 0 1160 428" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1160" height="88" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="20" y="32" font-size="18" font-weight="bold" fill="#3D4C63">生产控制区</text><text x="20" y="58" font-size="14" fill="#7A8699">安全Ⅰ区 · 实时控制 ｜ 安全Ⅱ区 · 非实时</text><rect x="420" y="20" width="300" height="48" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="436" y="50" font-size="15" fill="#3D4C63">被采集系统（DCS / 水电监控 / 风电主控）</text><rect x="750" y="20" width="180" height="48" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1" /><text x="766" y="50" font-size="15" fill="#3D4C63">采集代理</text><rect x="140" y="132" width="680" height="52" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1" stroke-dasharray="4 3" /><text x="160" y="156" font-size="17" font-weight="bold" fill="#2E6DA4">安全接入区</text><text x="160" y="176" font-size="14" fill="#7A8699">通信代理 + 端到端认证 ｜ 不存储重要数据</text><rect x="0" y="226" width="1160" height="202" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" /><text x="20" y="258" font-size="18" font-weight="bold" fill="#1F3864">管理信息区（安全Ⅲ区 / 安全Ⅳ区）</text><text x="20" y="282" font-size="14" fill="#7A8699">多租户平台全部资源都在此区内，包含 L3 物理隔离的独立集群</text><rect x="20" y="300" width="330" height="62" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="38" y="326" font-size="16" font-weight="bold" fill="#1F3864">集团中心云</text><text x="38" y="348" font-size="14" fill="#7A8699">管控面 + 平台服务 + 数据面</text><rect x="368" y="300" width="300" height="62" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="386" y="326" font-size="16" font-weight="bold" fill="#1F3864">区域节点</text><text x="386" y="348" font-size="14" fill="#7A8699">汇聚 + 就近接入</text><rect x="686" y="300" width="300" height="62" fill="#F2F5F9" stroke="#D9DEE7" stroke-width="1" /><text x="704" y="326" font-size="16" font-weight="bold" fill="#1F3864">场站边缘采集</text><text x="704" y="348" font-size="14" fill="#7A8699">只缓存非重要数据</text><text x="20" y="398" font-size="14" fill="#3D4C63">L3 物理隔离 = 独立集群 + 独立资源池 + 独立控制面，但仍在安全Ⅲ区内</text><line x1="300" y1="88" x2="300" y2="132" stroke="#1F3864" stroke-width="2" /><polygon points="300,132 295,122 305,122" fill="#1F3864" /><text x="318" y="116" font-size="14" fill="#1F3864">电力专用横向单向安全隔离装置</text><line x1="300" y1="184" x2="300" y2="226" stroke="#1F3864" stroke-width="2" /><polygon points="300,226 295,216 305,216" fill="#1F3864" /><line x1="1040" y1="226" x2="1040" y2="88" stroke="#B3261E" stroke-width="1.25" stroke-dasharray="5 4" /><line x1="1030" y1="147" x2="1050" y2="167" stroke="#B3261E" stroke-width="2" /><line x1="1050" y1="147" x2="1030" y2="167" stroke="#B3261E" stroke-width="2" /><text x="840" y="120" font-size="14" fill="#B3261E" text-anchor="end">Ⅲ/Ⅳ 区 → Ⅰ/Ⅱ 区回写：不支持</text></svg>